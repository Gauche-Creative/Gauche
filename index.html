<script>
(function () {
  var cv = document.getElementById('field'), ctx = cv.getContext('2d');
  var W = 240, H, img;
  var pal = [
    [34, 15, 12],    // #220F0C deep edge brown
    [64, 26, 16],    // #401A10
    [88, 40, 23],    // #582817
    [106, 54, 33],   // #6A3621
    [131, 81, 54],   // #835136
    [151, 101, 73],  // #976549
    [164, 116, 90],  // #A4745A
    [176, 130, 104], // #B08268
    [189, 144, 119], // #BD9077
    [199, 165, 142], // #C7A58E
    [214, 183, 159], // #D6B79F
    [225, 194, 162], // #E1C2A2
    [235, 191, 126], // #EBBF7E warm haze
    [223, 140, 45],  // #DF8C2D amber
    [67, 22, 6],     // #431606 dark central seam
    [101, 35, 9],    // #652309
    [180, 110, 53],  // #B46E35
    [209, 156, 123], // #D19C7B
    [189, 138, 131], // #BD8A83
    [163, 108, 113], // #A36C71
    [138, 83, 85],   // #8A5355
    [106, 57, 62],   // #6A393E
    [73, 37, 38],    // #492526
    [34, 15, 17]     // #220F11 deep edge
  ];
  // Smooth Catmull-Rom colour lookup across the full palette.
  // This intentionally derives its segment count from the palette so the
  // field can use many more colour stops without changing the renderer.
  var N = 1024, lut = new Uint8Array(N * 3);
  function cr(p0, p1, p2, p3, t) {
    return 0.5 * ((2 * p1) + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t * t + (-p0 + 3 * p1 - 3 * p2 + p3) * t * t * t);
  }
  var palSegments = pal.length - 1;
  for (var i = 0; i < N; i++) {
    var q = i / (N - 1) * palSegments;
    var k = Math.min(palSegments - 1, Math.floor(q));
    var t = q - k;
    var a = pal[Math.max(0, k - 1)];
    var b = pal[k];
    var c = pal[k + 1];
    var d = pal[Math.min(pal.length - 1, k + 2)];
    for (var ch = 0; ch < 3; ch++) {
      var v = cr(a[ch], b[ch], c[ch], d[ch], t);
      lut[i * 3 + ch] = v < 0 ? 0 : v > 255 ? 255 : v;
    }
  }

  function size() {
    H = Math.max(120, Math.round(W * innerHeight / innerWidth));
    cv.width = W; cv.height = H; img = ctx.createImageData(W, H);
    dirty = true;
  }

  // state: cursor position in palette space + pressure strength, each with two-stage inertia
  var S = 128, sig = 0.17, K = 1.25;
  var sArr = new Float32Array(W), cum = new Float32Array(S + 1);
  var tgtSc = 0.5, tgtI = 0, sc1 = 0.5, sc2 = 0.5, i1 = 0, i2 = 0, cursorX = 0.5;
  var dirty = true, running = false;
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function buildMap(sc, inten) {
    var j, s, m, total;
    cum[0] = 0;
    for (j = 0; j < S; j++) {
      s = (j + 0.5) / S;
      m = 1 + K * inten * Math.exp(-(s - sc) * (s - sc) / (2 * sig * sig));
      cum[j + 1] = cum[j] + m;
    }
    total = cum[S];
    var p = 0;
    for (var x = 0; x < W; x++) {
      var target = x / (W - 1) * total;
      while (p < S - 1 && cum[p + 1] < target) p++;
      var seg = cum[p + 1] - cum[p];
      sArr[x] = (p + (seg > 0 ? (target - cum[p]) / seg : 0)) / S;
    }
  }

  function draw() {
    buildMap(sc2, i2);
    var data = img.data, o = 0, x, y;
    for (y = 0; y < H; y++) {
      var v = y / (H - 1);
      for (x = 0; x < W; x++) {
        var u = x / (W - 1);
        // Very low-frequency haze: the colour flow stays horizontal, while the
        // surface gets subtle photographic softness and broad tonal variation.
        var haze = 0.010 * Math.sin(v * 4.0 + u * 1.7)
                 + 0.008 * Math.sin(v * 8.5 - u * 2.4 + 1.1);
        var s = sArr[x] + haze;
        var idx = (s * (N - 1)) | 0;
        if (idx < 0) idx = 0; else if (idx > N - 1) idx = N - 1;
        var r = lut[idx * 3], g = lut[idx * 3 + 1], b = lut[idx * 3 + 2];

        // Gentle vignette, strongest at the top/bottom edges, to retain the
        // hazy photographic character of the reference without changing hue.
        var edge = Math.pow(Math.abs(v - 0.5) * 2, 2.4);
        var lift = 1 - edge * 0.15;
        r *= lift; g *= lift; b *= lift;

        data[o++] = r > 255 ? 255 : r < 0 ? 0 : r;
        data[o++] = g > 255 ? 255 : g < 0 ? 0 : g;
        data[o++] = b > 255 ? 255 : b < 0 ? 0 : b;
        data[o++] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
  }

  function frame() {
    // palette position currently under the cursor (read from the displayed field)
    if (tgtI > 0) {
      var col = Math.max(0, Math.min(W - 1, Math.round(cursorX * (W - 1))));
      tgtSc = sArr[col];
    }
    sc1 += (tgtSc - sc1) * 0.07; sc2 += (sc1 - sc2) * 0.07;
    i1 += (tgtI - i1) * (tgtI > i1 ? 0.045 : 0.025); i2 += (i1 - i2) * 0.06;
    draw();
    var settled = Math.abs(sc2 - tgtSc) < 0.0004 && Math.abs(sc1 - sc2) < 0.0004 &&
                  Math.abs(i2 - tgtI) < 0.002 && Math.abs(i1 - i2) < 0.002;
    if (settled && tgtI === 0) { i1 = i2 = 0; draw(); running = false; return; }
    requestAnimationFrame(frame);
  }
  function wake() { if (!running) { running = true; requestAnimationFrame(frame); } }

  size();
  buildMap(0.5, 0); draw();
  addEventListener('resize', function () { size(); buildMap(sc2, i2); draw(); });
  if (reduce) return;

  function move(e) { cursorX = e.clientX / innerWidth; tgtI = 1; wake(); }
  function leave() { tgtI = 0; wake(); }
  addEventListener('pointermove', move, { passive: true });
  addEventListener('pointerdown', move, { passive: true });
  document.documentElement.addEventListener('pointerleave', leave);
  document.addEventListener('mouseleave', leave);
  addEventListener('pointerup', function (e) { if (e.pointerType !== 'mouse') leave(); });
  addEventListener('blur', leave);
})();
</script>
